name: idempotency
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      
  node1:
    image: redis:latest
    container_name: node1
    ports:
      - "6379:6379"
    volumes:
      - redis_node1_data:/data  
  node2:
    image: redis:latest
    container_name: node2
    ports:
      - "6380:6379"
    volumes:
      - redis_node2_data:/data  
  node3:
    image: redis:latest
    container_name: node3
    ports:
      - "6381:6379"
    volumes:
      - redis_node3_data:/data
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mq-broker
    ports:
      - "5672:5672"   # RabbitMQ AMQP port
      - "15672:15672" # Management UI dashboard port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
volumes:
  mssql_data:
  redis_node1_data:
  redis_node2_data:
  redis_node3_data:
  rabbitmq_data: 
networks:
  default:
    name: platform_shared_network   # 👈 Fixed name: no more "projectname_default"